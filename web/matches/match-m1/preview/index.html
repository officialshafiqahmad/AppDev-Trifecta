<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trifecta — Match Preview (Guest)</title>
<link rel="stylesheet" href="/web/assets/player.css">
</head>
<body data-match-id="match-m1" data-state="upcoming">
<header class="topbar"><span class="brand">Trifecta</span><span>Match preview</span></header>
<main>
  <div class="notice-state">This match has not started yet. The live player will appear here when the match begins.</div>
  <div class="score-banner" data-testid="live-score-banner">
    <span class="teams">Alpha FC vs Alpha Kings</span>
    <span class="score" data-testid="live-score-value">0 - 0</span>
    <span class="minute">Football · League Alpha 1 · Upcoming</span>
  </div>
  <section class="card" data-testid="pinned-merch-card" aria-label="Pinned merchandise">
    <h2>Pinned merchandise</h2>
    <div class="merch">
      <div><div class="name">Alpha FC Home Jersey — Size L</div><div class="price">PKR 4,500.00</div></div>
      <button type="button" data-testid="add-to-guest-cart-btn" aria-label="Add jersey size L to guest cart">Add to cart</button>
    </div>
    <p class="cart-line">Guest cart: <span data-testid="guest-cart-count">0</span> item(s)</p>
  </section>
</main>
<script src="/web/assets/player.js"></script>
</body>
</html>
