<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trifecta — Match Replay (Guest)</title>
<link rel="stylesheet" href="/web/assets/player.css">
</head>
<body data-match-id="match-m1" data-state="completed">
<header class="topbar"><span class="brand">Trifecta</span><span>Match replay</span></header>
<main>
  <div class="player-wrap" data-testid="guest-video-player">
    <video controls playsinline preload="none" aria-label="Match replay video player" src="http://localhost:8888/live/match-m1/index.m3u8"></video>
    <div class="waiting-state">Replay will be available shortly after the match ends</div>
  </div>
  <div class="score-banner" data-testid="live-score-banner">
    <span class="teams">Alpha FC vs Alpha Kings</span>
    <span class="score" data-testid="live-score-value">1 - 0</span>
    <span class="minute">Football · League Alpha 1 · Full time</span>
  </div>
</main>
<script src="/web/assets/player.js"></script>
</body>
</html>
