services:
  api:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DAY1_SALT: ${DAY1_SALT}
      PORT: "8080"
      DATABASE_URL: postgres://nascon:nascon@db:5432/nascon
      REDIS_URL: redis://redis:6379
      QUEUE_URL: redis://queue:6379
      OBJECT_STORE_URL: http://object-store:9000
      JWT_SECRET: ${JWT_SECRET:-replace-for-local-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon
      POSTGRES_DB: nascon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  queue:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  object-store:
    build:
      context: ./backend
    command: ["node", "src/object-store.js"]
    environment:
      PORT: "9000"
      OBJECT_STORE_DIR: /data
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: ./backend
    command: ["node", "src/worker.js"]
    environment:
      DAY1_SALT: ${DAY1_SALT}
      QUEUE_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379
      OBJECT_STORE_URL: http://object-store:9000
    depends_on:
      redis:
        condition: service_healthy
      queue:
        condition: service_healthy
      object-store:
        condition: service_healthy

volumes:
  pgdata:
  objectdata:
